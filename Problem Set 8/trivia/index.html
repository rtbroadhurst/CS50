<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            function multiple_choice(button, answer)
            {

                let multiple_choice_result = document.getElementById("multiple_choice_result");

                if (answer == "5:1")
                {
                    button.style.backgroundColor = "green";
                    multiple_choice_result.textContent = "Correct";
                }

                else
                {
                    button.style.backgroundColor = "red";
                    multiple_choice_result.textContent = "Incorrect";
                }
            }

            function free_response(text_box)
            {
                let value = document.getElementById("answer").value;

                if (value == "Wellington")
                {
                    document.getElementById("answer").style.backgroundColor = "green";
                    free_response_result.textContent = "Correct";

                }

                else
                {
                    document.getElementById("answer").style.backgroundColor = "red";
                    free_response_result.textContent = "Incorrect";
                }

            }
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <h3>What is the approximate ratio of people to sheep in New Zealand?</h3>
                <button class="choice" onclick="multiple_choice(this, '6:1')">6:1</button>
                <button class="choice" onclick="multiple_choice(this, '3:1')">3:1</button>
                <button class="choice" onclick="multiple_choice(this, '5:1')">5:1</button>
                <button class="choice" onclick="multiple_choice(this, '1:3')">1:3</button>
                <p id="multiple_choice_result"></p>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <h3>What is the capital of New Zealand?</h3>
                <input type="text" id="answer">
                <button onclick="free_response()">Submit Answer</button>
                <p id="free_response_result"></p>
            </div>
        </div>
    </body>
</html>
